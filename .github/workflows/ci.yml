name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  php-release-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2
        with:
          php-version: "8.3"
      - name: Lint PHP files
        shell: pwsh
        run: |
          $files = @(
            'public/index.php',
            'router.php',
            'src/Services/RegulatoryDisclosureKitService.php',
            'src/Views/render.php',
            'plugin/wordpress-regulatory-disclosure-kit.php',
            'scripts/run_demo.php',
            'scripts/prerender.php'
          )
          foreach ($file in $files) {
            php -l $file
          }
      - name: Demo payload
        run: php scripts/run_demo.php
      - name: Prerender
        run: php scripts/prerender.php
      - name: Smoke check
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\smoke_check.ps1
